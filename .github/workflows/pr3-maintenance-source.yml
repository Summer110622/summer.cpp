name: PR3 maintenance source snapshot
on:
  push:
    branches: ['maint/pr3-low-level']
    paths: ['.github/workflows/pr3-maintenance-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef9a5ebcc0db59f09d05aac37aac118895cd5022
          persist-credentials: false
      - name: Archive the reviewed source commit without credentials or git metadata
        run: git archive --format=tar.gz --output=pr3-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pr3-source-ef9a5eb
          path: pr3-source.tar.gz
          retention-days: 1
