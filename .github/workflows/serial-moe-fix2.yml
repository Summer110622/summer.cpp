name: Retry serial MoE newline repair # 逐次expertブロックを物理行へ展開して再検証する。
on: # 一時修復ワークフローの起動条件を定義する。
  push: # このファイル追加時だけ起動する。
    branches: [feat/serial-moe-experts] # 作業ブランチだけを対象にする。
    paths: ['.github/workflows/serial-moe-fix2.yml'] # 自身の追加時だけ実行する。
permissions: # 必要な権限を最小化する。
  contents: write # 検証済み修復をブランチへ保存するため書き込みを許可する。
jobs: # 修復とビルドを一つのジョブで実行する。
  fix: # 修復ジョブを定義する。
    runs-on: ubuntu-24.04 # Linux CPU環境で検証する。
    timeout-minutes: 20 # 停止時の実行時間を制限する。
    steps: # checkoutからコミットまで順に処理する。
      - uses: actions/checkout@v4 # 作業ブランチを取得する。
        with: # checkout対象を指定する。
          ref: feat/serial-moe-experts # 修復対象ブランチを直接取得する。
      - name: Materialize serial block lines # 一物理行に残ったリテラル改行を実改行へ変換する。
        run: | # Pythonで対象物理行だけを修復する。
          python3 - <<'PY' # ソース変換を厳密に実行する。
          from pathlib import Path # UTF-8ソースを読み書きする。
          path = Path('src/llama-graph.cpp') # 共通MoEグラフ実装を対象にする。
          text = path.read_text(encoding='utf-8') # 現在のソースを読み込む。
          marker = '    if (serial_moe_experts_enabled() && hparams.n_expert_used(il) > 1) {' # 逐次経路の開始文字列を定義する。
          start = text.index(marker) # 逐次経路を含む物理行の先頭位置を取得する。
          end = text.index('\n', start) # 現在一行に収まっている逐次経路の物理行末を取得する。
          segment = text[start:end] # 修復対象をその一行だけに限定する。
          assert segment.count('\\n') > 60 # 期待どおり多数のリテラル改行が存在することを確認する。
          fixed = segment.replace('\\n', '\n') # リテラル改行を実際のC++行区切りへ変換する。
          text = text[:start] + fixed + text[end:] # 修復済みブロックを元ソースへ戻す。
          path.write_text(text, encoding='utf-8') # 修復済みソースを書き戻す。
          PY
      - name: Verify line comments # 追加された逐次expertコードの各非空行に説明コメントがあることを確認する。
        run: | # 追加ブロックだけを機械検査する。
          python3 - <<'PY' # コメント要件を検証する。
          from pathlib import Path # ソースを読み込む。
          text = Path('src/llama-graph.cpp').read_text(encoding='utf-8') # 修復後のソース全文を取得する。
          start = text.index('    if (serial_moe_experts_enabled() && hparams.n_expert_used(il) > 1) {') # 追加ブロック先頭を取得する。
          end_marker = '    } // Serial MoE実験経路を終了する。' # 追加ブロック終端の説明コメントを定義する。
          end = text.index(end_marker, start) + len(end_marker) # 終端行まで含めた範囲を取得する。
          lines = [line for line in text[start:end].splitlines() if line.strip()] # 非空の追加行だけを列挙する。
          missing = [line for line in lines if '//' not in line] # 説明コメントを持たない行を抽出する。
          assert not missing, repr(missing[:5]) # 一行でもコメントが欠ければ失敗させる。
          assert len(lines) > 60 # 実装が多数の物理行へ展開されたことを保証する。
          print(f'validated {len(lines)} commented serial MoE lines') # 検証行数をログへ出力する。
          PY
      - name: Configure CPU library # 共通推論ライブラリのCPUビルドを生成する。
        run: cmake -S . -B build-serial -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF # フロントエンド依存を除外する。
      - name: Build llama library # 修復された逐次expert経路をコンパイル・リンクする。
        run: cmake --build build-serial --parallel 3 --target llama # 共通ライブラリの成功を必須にする。
      - name: Commit fixed source # 検証成功後だけ修復済み実装を保存する。
        run: | # Git検査とコミットを行う。
          git diff --check # whitespace破損がないことを確認する。
          git config user.name 'github-actions[bot]' # 自動コミット作者を設定する。
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # 自動コミットメールを設定する。
          git add src/llama-graph.cpp # 修復した実装だけをstageする。
          git commit -m 'fix: materialize serial MoE expert graph lines' # 修復内容を明示するコミットを作成する。
          git push origin HEAD:feat/serial-moe-experts # 検証済み修復をブランチへ反映する。
