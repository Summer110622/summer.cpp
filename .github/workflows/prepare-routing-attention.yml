name: Prepare routing-attention validation
on:
  push:
    branches: [feat/routing-attention-v3]
    paths: [.github/workflows/prepare-routing-attention.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact source for offline validation
        run: git archive --format=tar HEAD | gzip > pr2-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: routing-attention-source
          path: pr2-source.tar.gz
          retention-days: 1
