name: Retry serial MoE validation # 既存の適用手順を正しいビルド対象で再検証する。
on: # この一時ワークフローの起動条件を定義する。
  push: # ファイル追加時のpushだけで起動する。
    branches: [feat/serial-moe-experts] # Serial MoE作業ブランチだけを対象にする。
    paths: ['.github/workflows/serial-moe-retry.yml'] # 自身の追加時だけ実行して再帰を防ぐ。
permissions: # 必要な権限を最小化する。
  contents: write # 検証済み実装を作業ブランチへコミットするため書き込みを許可する。
jobs: # 再適用とビルド検証をまとめる。
  retry: # 再検証ジョブを定義する。
    runs-on: ubuntu-24.04 # Linux上でCPUビルドを検証する。
    timeout-minutes: 20 # ビルド停止時の実行時間を制限する。
    steps: # ソース取得からコミットまで順番に実行する。
      - uses: actions/checkout@v4 # 作業ブランチを取得する。
        with: # checkout対象を指定する。
          ref: feat/serial-moe-experts # 同じ作業ブランチを直接更新する。
      - name: Reuse staged transformation # 最初のワークフローに保存したPython変換を再利用する。
        run: | # heredoc本体だけを抽出してPythonへ渡す。
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/serial-moe-apply.yml | sed '1d;$d;s/^          //' > "$RUNNER_TEMP/apply.py" # 既存変換スクリプトを重複なしで抽出する。
          python3 "$RUNNER_TEMP/apply.py" # 同じソース変換と文書生成を実行する。
      - name: Configure CPU build # CPU専用の最小ビルド構成を生成する。
        run: cmake -S . -B build-serial -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF # 共通グラフとアプリ本体を検証できる構成にする。
      - name: Build application # このforkで実在するアプリケーションターゲットをコンパイルする。
        run: cmake --build build-serial --parallel 3 --target llama-app # Serial MoEコードを含むライブラリと実行ファイルをリンクする。
      - name: Commit verified implementation # ビルド成功後だけ実装を保存する。
        run: | # Git検査とコミットを連続して行う。
          git diff --check # whitespace破損がないことを確認する。
          git config user.name 'github-actions[bot]' # 自動コミットの作者名を設定する。
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # 自動コミットの公開メールを設定する。
          git add src/llama-graph.cpp docs/experimental/serial-moe-experts.md # 実装と仕様書だけをstageする。
          git commit -m 'feat: execute routed MoE experts serially' # 検証済み変更を一つの機能コミットにまとめる。
          git push origin HEAD:feat/serial-moe-experts # 作業ブランチへ検証済みコミットを反映する。
