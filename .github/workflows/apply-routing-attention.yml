name: Apply and validate routing-attention change
on:
  push:
    branches: [feat/routing-attention-v3]
    paths:
      - '.github/routing-attention-patch/**'
      - '.github/workflows/apply-routing-attention.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Summer110622/summer.cpp' && github.ref == 'refs/heads/feat/routing-attention-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply the exact locally tested patch
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/routing-attention-patch').glob('*.b64'))
          assert len(parts) == 7
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a3e3a9329da2254b911a3655bda0d3b0df51926fc3e355f6bacebd066ad6e236'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
      - name: Configure isolated CPU build
        run: >-
          cmake -S . -B build-routing-validation
          -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CCACHE=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF
          -DBUILD_SHARED_LIBS=OFF -DLLAMA_OPENSSL=OFF
      - name: Build production library and regressions
        run: cmake --build build-routing-validation --target llama test-routing-attention test-routing-attention-model -j 2
      - name: Validate numerical and production-model regressions
        run: ctest --test-dir build-routing-validation -R '^test-routing-attention' --output-on-failure
      - name: Commit only validated source and remove temporary transport workflows
        shell: bash
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/feat/routing-attention-v3 | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          git add src/llama-graph.cpp src/llama-context.cpp src/llama-graph-opt.h
          git add tests/CMakeLists.txt tests/test-routing-attention.cpp tests/test-routing-attention-model.cpp
          git add docs/experimental/routing-attention-v3.md docs/experimental/serial-moe-experts.md
          git add .github/workflows/routing-attention.yml
          git rm -r .github/routing-attention-patch .github/workflows/apply-routing-attention.yml .github/workflows/prepare-routing-attention.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add guarded Top-K routing, shared expert chunks and query-chunked attention'
          git push origin HEAD:refs/heads/feat/routing-attention-v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-attention-validation
          path: build-routing-validation/Testing/Temporary/LastTest.log
          retention-days: 7
