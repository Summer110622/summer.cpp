name: Apply verified BitAttention explanations # 検証済みの説明コメントを専用ブランチへ一度だけ反映する。
on: # この一時ワークフロー自身の追加時だけ実行する。
  push: # プルリクエストや外部入力からは実行しない。
    branches: [feat/bit-attention-kernel] # 本体ブランチには書き込まない。
    paths: [.github/workflows/bit-attention-apply.yml] # 自身の変更以外では起動しない。
permissions: # コメント反映に必要な権限だけを指定する。
  contents: write # 検証したソースを専用ブランチへコミットするために使用する。
jobs: # 一つの書き込み処理に限定する。
  apply: # ハッシュ検証後にのみコメントを反映する。
    if: github.repository == 'Summer110622/summer.cpp' && github.ref == 'refs/heads/feat/bit-attention-kernel' # 所定のリポジトリとブランチ以外での書き込みを防ぐ。
    runs-on: ubuntu-latest # GitHub管理の一時的な実行環境を使用する。
    timeout-minutes: 5 # 意図しない長時間実行を防ぐ。
    steps: # 取得、検証、反映を順番に実施する。
      - uses: actions/checkout@v4 # このイベントのコミットを取得する。
        with: # 通常のfast-forward pushに必要な認証をこのジョブ内に限定する。
          persist-credentials: true # 書き込み終了後はcheckoutの後処理で認証を除去する。
      - name: Verify and apply annotation manifest # ローカル検証済みの内容だけを反映する。
        shell: python3 {0} # ヒアドキュメントを使わずPythonとして直接実行する。
        env: # GitHub APIの読み取り認証をプロセスの環境変数で渡す。
          GH_TOKEN: ${{ github.token }} # トークンをソースやログへ書き込まない。
        run: | # 各行の意図をコードと同じ行へ記載する。
          import base64, bz2, hashlib, json, os, subprocess, urllib.request # 転送データの復元と完全性検査に標準ライブラリだけを使う。
          from pathlib import Path # 作業ディレクトリ内のファイルを安全に解決する。
          repo = 'Summer110622/summer.cpp' # APIの宛先を依頼されたリポジトリへ固定する。
          shas = ['9ccde1f40f8bd44238bb88f3292de187ce3c7a48', '6bba4c319278497280a075e0026e863dc37ee710', 'fcc5cabb5ae4e7d803ca071965cdb4031ea9ec27'] # 検証済み圧縮データの三つのGit blobを順番に取得する。
          parts = [] # 個々の転送片を結合するまでメモリ内に保持する。
          for sha in shas: # 指定されたblob以外の外部データを使用しない。
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}) # 同一GitHubリポジトリへの読み取り要求を作る。
              with urllib.request.urlopen(request, timeout=30) as response: # 通信失敗時は書き込み前に停止する。
                  item = json.load(response) # GitHubが返したblob情報を解析する。
              piece = base64.b64decode(item['content']) # GitHubのbase64表現をバイト列へ復元する。
              if hashlib.sha1(f'blob {len(piece)}\0'.encode() + piece).hexdigest() != sha: # 取得したblobのGitオブジェクトIDを検証する。
                  raise RuntimeError('Blob integrity mismatch') # 誤った転送片では反映を続けない。
              parts.append(piece) # 完全性を確認した転送片だけを保存する。
          raw = bz2.decompress(b''.join(parts)) # 検証済みのコメント差分マニフェストを復元する。
          if len(raw) != 99018 or hashlib.sha256(raw).hexdigest() != '6ba2754e8edc8c2e7c268387b28cd69eb58f116e9653604da183ddf082375571': # ローカルでテストした差分と完全一致することを確認する。
              raise RuntimeError('Manifest integrity mismatch') # 未検証の内容を実行・反映しない。
          manifest = json.loads(raw) # ハッシュ確認後にのみファイル単位の変更を解析する。
          if manifest['base'] != '8a27e6c2ad5bbecdf4fb06373327d3d9398d1fd4' or len(manifest['files']) != 26: # 対象の基準コミットと変更範囲を確認する。
              raise RuntimeError('Unexpected manifest scope') # 想定外の変更セットを拒否する。
          root = Path.cwd().resolve() # リポジトリのルートをパス検査の基準にする。
          prepared = {} # 全ファイルの検証完了までディスクを書き換えない。
          for name, change in manifest['files'].items(): # 個々のファイルで変更前後のハッシュを確認する。
              relative = Path(name) # リポジトリ相対パスとして扱う。
              if relative.is_absolute() or '..' in relative.parts or name.startswith('.github/'): # 作業範囲外とワークフローの変更を禁止する。
                  raise RuntimeError('Disallowed destination') # 危険なパスでは処理を停止する。
              target = root / relative # 書き込み先をリポジトリ内に限定する。
              if target.is_symlink() or root not in target.resolve().parents: # シンボリックリンクによる範囲外アクセスを拒否する。
                  raise RuntimeError('Destination escapes repository') # 安全でない書き込み先を拒否する。
              if change['old_sha256'] is None: # 新しいコメント検査スクリプトを作成する場合を処理する。
                  if target.exists(): # 同名ファイルが後から追加されていたら上書きしない。
                      raise RuntimeError('New file already exists: ' + name) # 並行作業と競合した場合は停止する。
                  result = change['content'].encode('utf-8') # ハッシュ確認済みの新規スクリプトをバイト列へ変換する。
              else: # 既存ファイルへ同じ行の説明を追加する場合を処理する。
                  old = target.read_bytes() # 現在のブランチにあるファイルを読む。
                  if hashlib.sha256(old).hexdigest() != change['old_sha256']: # ローカル検証後の並行変更を検出する。
                      raise RuntimeError('Source changed concurrently: ' + name) # 他の変更を上書きせず停止する。
                  lines = old.decode('utf-8').splitlines() # コードの行順を保持して説明を追加する。
                  for index, suffix in change['suffixes']: # マニフェストで指定された行だけを更新する。
                      if not suffix.startswith((' // ', ' # ')) or '\n' in suffix: # コードの置換や複数行の挿入を禁止する。
                          raise RuntimeError('Expected a same-line explanation') # 説明コメント以外の変更を拒否する。
                      lines[index] += suffix # 元のコードを保ったまま行末へ説明を追加する。
                  lines.extend(change['append']) # 検証手順のドキュメント追記を末尾へ追加する。
                  result = ('\n'.join(lines) + '\n').encode('utf-8') # 元と同じLF改行でファイルを再構成する。
              if hashlib.sha256(result).hexdigest() != change['new_sha256']: # テスト済みの完成ファイルと完全一致することを確認する。
                  raise RuntimeError('Output mismatch: ' + name) # 差分適用の誤りをコミット前に検出する。
              prepared[name] = result # 全ファイルの検証後に書き込む内容を保持する。
          for name, result in prepared.items(): # すべての検査が成功した後にだけ書き込む。
              (root / name).write_bytes(result) # 検証済みの説明付きソースを保存する。
          subprocess.run(['git', 'add', '--', *prepared.keys()], check=True) # 検証した26ファイルだけをステージする。
          print('Verified and staged 26 files; all source and output hashes matched.') # 認証情報を含めず検証結果だけを記録する。
      - name: Check and commit # コメント検査が通った変更だけを保存する。
        run: | # 各コマンドの失敗時に処理を停止する。
          set -euo pipefail # エラーと未定義変数を見逃さない。
          git diff --cached --check # ステージした差分の空白エラーを検査する。
          python3 -m py_compile tests/bit-attention-comments.py # 新しい検査スクリプトの構文を検証する。
          git fetch --no-tags --depth=1 origin 5265486cb491ea5b160a3d20ca1e105ae5422312 # 機能追加前の基準コミットだけを取得する。
          python3 tests/bit-attention-comments.py --base 5265486cb491ea5b160a3d20ca1e105ae5422312 # 追加コードの各行に説明があることを検証する。
          git config user.name 'github-actions[bot]' # 一時反映ジョブからのコミットであることを明示する。
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' # GitHub Actionsの公開ボット識別子を使用する。
          git commit -m 'docs(bit-attn): explain every implementation line and enforce coverage' # 検証済みの説明とコメント検査を一つのコミットにまとめる。
          git push origin HEAD:feat/bit-attention-kernel # 強制更新せず専用ブランチへfast-forwardで反映する。
