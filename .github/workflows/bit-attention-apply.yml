name: Apply BitAttention RPC compatibility guard

on:
  push:
    branches: [feat/bit-attention-kernel]
    paths: ['.github/workflows/bit-attention-apply.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Summer110622/summer.cpp' && github.ref == 'refs/heads/feat/bit-attention-kernel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bit-attention-kernel
      - name: Apply checked RPC compatibility edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, f'Expected exactly one match in {path}'
              p.write_text(s.replace(old, new))
          replace('ggml/include/ggml-rpc.h', 'RPC_PROTO_PATCH_VERSION    0', 'RPC_PROTO_PATCH_VERSION    1')
          replace('ggml/include/ggml-rpc.h', 'GGML_OP_COUNT == 101', 'GGML_OP_COUNT == 104')
          replace('ggml/src/ggml-rpc/ggml-rpc.cpp',
                  '''static bool ggml_backend_rpc_device_supports_op(ggml_backend_dev_t dev, const struct ggml_tensor * op) {
              GGML_UNUSED(dev);
              GGML_UNUSED(op);
              //TODO: call the remote backend and cache the results
              return true;
          }''',
                  '''static bool ggml_backend_rpc_device_supports_op(ggml_backend_dev_t dev, const struct ggml_tensor * op) {
              GGML_UNUSED(dev);
              // RPC does not negotiate per-op backend capabilities. Do not send new
              // BitAttention IDs to an older server or assume its device supports them.
              // The scheduler can run these experimental ops on the local CPU instead.
              if (op->op == GGML_OP_BIT_PACK || op->op == GGML_OP_BIT_MUL_MAT || op->op == GGML_OP_BIT_ATTN_EXT) {
                  return false;
              }
              //TODO: call the remote backend and cache the results
              return true;
          }''')
          replace('docs/experimental/bit-attention.md',
                  'other value dimensions and non-NVIDIA accelerator backends use CPU fallback.',
                  'other value dimensions and non-NVIDIA accelerator backends use CPU fallback.\n'
                  'RPC does not negotiate per-op backend capabilities, so the new operations run\n'
                  'on the local CPU rather than being sent to an unsupported remote backend.')
          PY
          git add ggml/include/ggml-rpc.h ggml/src/ggml-rpc/ggml-rpc.cpp docs/experimental/bit-attention.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep BitAttention off unsupported RPC devices and update op ABI check'
          git push origin HEAD:feat/bit-attention-kernel
